# QLoRA fine-tune config for ticket -> notification summarization.
model:
  id: "Qwen/Qwen2.5-7B-Instruct"   # alt: meta-llama/Llama-3.1-8B-Instruct
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                  "gate_proj", "up_proj", "down_proj"]
  task_type: "CAUSAL_LM"

training:
  output_dir: "outputs/adapter"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  max_seq_length: 2048
  gradient_checkpointing: true
  bf16: true

data:
  train_file: "data/train.jsonl"
  prompt_template: "prompts/summarize.txt"
